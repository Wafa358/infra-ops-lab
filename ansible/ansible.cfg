[defaults]
inventory = inventory.ini
remote_user = ubuntu
private_key_file = ~/.ssh/infra_lab
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
# accept-new: trust a VM's host key the first time, refuse it if it later changes.
# The lab's own known_hosts file: 'make inventory' cleans it when VM addresses move.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/infra_lab_known_hosts
pipelining = True
