---
- name: Create the app directory
  ansible.builtin.file:
    path: /opt/demo-app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the demo app
  ansible.builtin.copy:
    src: app.py
    dest: /opt/demo-app/app.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart demo-app

- name: Install the systemd unit
  ansible.builtin.copy:
    src: demo-app.service
    dest: /etc/systemd/system/demo-app.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart demo-app

- name: Start the demo app now and at every boot
  ansible.builtin.systemd_service:
    name: demo-app
    state: started
    enabled: true
    daemon_reload: true
