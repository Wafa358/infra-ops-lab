---
# Ubuntu 24.04 starts sshd through socket activation, so /run/sshd may not exist yet;
# `sshd -t` (used to validate the file below) refuses to run without it.
- name: Make sure the privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the SSH hardening settings
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Check the complete sshd configuration before any restart
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
