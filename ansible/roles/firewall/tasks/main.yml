---
- name: Write the nftables ruleset (checked with `nft -c` before it is installed)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Start nftables now and at every boot
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
