---
# Step 2: the same baseline on every VM.
- name: Baseline every lab VM
  hosts: lab
  become: true
  roles:
    - base
    - users
    - ssh_hardening
    - firewall

# Step 3a: internal DNS, TLS, web tier and load balancer.
- name: Create the lab certificate authority and the web certificate on the control node
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - tls_ca

- name: Trust the lab CA on every VM
  hosts: lab
  become: true
  roles:
    - trust_ca

- name: Serve the lab.internal zone from the monitoring VM
  hosts: mon
  become: true
  roles:
    - dns_server

- name: Resolve lab.internal names on every VM
  hosts: lab
  become: true
  roles:
    - resolver

# Nginx is configured by Ansible or, from step 5, by Puppet: see web_config_tool.
- name: Run the demo app behind Nginx on the web tier
  hosts: web
  become: true
  roles:
    - app
    - role: nginx
      when: web_config_tool == 'ansible'
    - role: puppet_nginx
      when: web_config_tool == 'puppet'


- name: Terminate HTTPS and balance the web tier on the load balancer
  hosts: lb
  become: true
  roles:
    - haproxy

# Step 3b: WireGuard VPN for admin access, with the monitoring VM as the hub.
- name: Create the control node's VPN key
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - wireguard_client

- name: Connect every VM to the VPN hub
  hosts: lab
  become: true
  roles:
    - wireguard

- name: Write the control node's VPN configuration
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write the tunnel configuration of the control node
      ansible.builtin.include_role:
        name: wireguard_client
        tasks_from: config

# Step 4: the Bash toolkit runs on every VM: health checks, backups and log reports.
- name: Run the toolkit on every VM
  hosts: lab
  become: true
  roles:
    - toolkit
