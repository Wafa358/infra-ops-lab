---
# Proves the baseline works, rather than trusting that the playbook ran:
# run `make verify` after `make provision`.

- name: Check SSH, firewall and admin access on every VM
  hosts: lab
  become: true
  gather_facts: false
  tasks:
    - name: Read the effective sshd settings
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_settings
      changed_when: false

    - name: Password and root logins are off
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_settings.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_settings.stdout_lines"
          - "'permitrootlogin no' in sshd_settings.stdout_lines"
        success_msg: "{{ inventory_hostname }}: only key-based logins are accepted"

    - name: Read the inbound firewall chain
      ansible.builtin.command: /usr/sbin/nft list chain inet filter input
      register: input_chain
      changed_when: false

    - name: Inbound traffic is dropped by default
      ansible.builtin.assert:
        that: "'policy drop' in input_chain.stdout"
        success_msg: "{{ inventory_hostname }}: inbound policy is drop"

    - name: Read the ops user's sudo rights
      ansible.builtin.command: sudo -l -U ops
      register: ops_sudo
      changed_when: false

    - name: The ops user can administer the VM
      ansible.builtin.assert:
        that: "'NOPASSWD: ALL' in ops_sudo.stdout"
        success_msg: "{{ inventory_hostname }}: ops has sudo"

- name: Check that only the web tier can reach the database port
  hosts: web:mon
  gather_facts: false
  vars:
    db_address: "{{ hostvars[groups['db'][0]].ansible_host }}"
  tasks:
    # Nothing listens on 5432 yet: "refused" means the firewall let the packet through,
    # "timed out" means the firewall dropped it.
    - name: Try TCP 5432 on the database VM
      ansible.builtin.command: nc -zv -w 3 {{ db_address }} 5432
      register: probe
      changed_when: false
      failed_when: false

    - name: Web gets through, monitoring is blocked
      ansible.builtin.assert:
        that: >-
          ('refused' in probe.stderr) if inventory_hostname in groups['web']
          else ('timed out' in probe.stderr)
        success_msg: >-
          {{ inventory_hostname }} -> db:5432
          {{ 'allowed (web tier)' if inventory_hostname in groups['web'] else 'blocked' }}
        fail_msg: "{{ inventory_hostname }} -> db:5432 gave: {{ probe.stderr }}"

# --- step 3a ------------------------------------------------------------------
- name: Check that every VM resolves every lab name through the lab DNS server
  hosts: lab
  gather_facts: false
  tasks:
    - name: Look up each VM by its lab.internal name
      ansible.builtin.command: getent hosts {{ item }}.{{ lab_domain }}
      loop: "{{ groups['lab'] | sort }}"
      register: lookups
      changed_when: false

    - name: Every name resolves to the right address
      ansible.builtin.assert:
        that: >-
          (lookups.results | map(attribute='stdout') | map('split') | map('first') | list)
          == (groups['lab'] | sort | map('extract', hostvars, 'ansible_host') | list)
        success_msg: "{{ inventory_hostname }}: all {{ groups['lab'] | length }} lab names resolve"

- name: Check HTTPS and load balancing from the control node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lb_address: "{{ hostvars[groups['lb'][0]].ansible_host }}"
  tasks:
    - name: Plain HTTP on the load balancer
      ansible.builtin.uri:
        url: "http://{{ lb_address }}/"
        use_proxy: false
        follow_redirects: none
        status_code: 301
      register: plain_http

    - name: Plain HTTP is redirected to HTTPS
      ansible.builtin.assert:
        that: plain_http.location is match('https://')
        success_msg: "http://{{ lb_address }} redirects to HTTPS"

    # ca_path makes the request fail on any certificate the lab CA did not sign;
    # the certificate lists lb1's address, so it validates without lab DNS on this machine.
    - name: Send 6 HTTPS requests through the load balancer
      ansible.builtin.uri:
        url: "https://{{ lb_address }}/"
        use_proxy: false
        ca_path: "{{ tls_ca_dir }}/ca.crt"
        headers:
          Host: "{{ web_service_name }}"
        return_content: true
      loop: "{{ range(6) | list }}"
      register: responses

    - name: Both web servers answered, behind a certificate signed by the lab CA
      ansible.builtin.assert:
        that: >-
          (responses.results | map(attribute='json') | map(attribute='served_by') | unique | sort)
          == (groups['web'] | sort)
        fail_msg: >-
          Only {{ responses.results | map(attribute='json') | map(attribute='served_by') | unique | join(', ') }}
          answered. A web server that just restarted needs about 4 seconds to rejoin: run make verify again.
        success_msg: "6 HTTPS requests were spread across {{ groups['web'] | sort | join(' and ') }}"

    - name: Try to reach a web server directly, bypassing the load balancer
      ansible.builtin.command: nc -zv -w 3 {{ hostvars[groups['web'][0]].ansible_host }} 80
      register: direct
      changed_when: false
      failed_when: false

    - name: The web servers only accept traffic from the load balancer
      ansible.builtin.assert:
        that: "'timed out' in direct.stderr"
        success_msg: "{{ groups['web'][0] }}:80 is blocked from outside the load balancer"

# --- step 3b: WireGuard VPN ----------------------------------------------------
- name: Check the VPN from the control node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lb_name: "{{ groups['lb'][0] }}"
  tasks:
    - name: Look for the control node's tunnel
      ansible.builtin.stat:
        path: /sys/class/net/wg-lab
      register: vpn_link

    - name: The control node's tunnel is up
      ansible.builtin.assert:
        that: vpn_link.stat.exists
        fail_msg: "The VPN is down on this machine: run 'make vpn-up', then 'make verify' again"
        success_msg: the wg-lab tunnel is up

    # A tunnel can take a few seconds to (re)connect, hence the retries.
    - name: Wait until the hub answers through the tunnel
      ansible.builtin.command: ping -c 1 -W 2 {{ vpn_addresses[vpn_hub] }}
      register: vpn_hub_ping
      until: vpn_hub_ping.rc == 0
      retries: 12
      delay: 5
      changed_when: false

    - name: Ping every VM at its VPN address
      ansible.builtin.command: ping -c 1 -W 2 {{ vpn_addresses[item] }}
      loop: "{{ groups['lab'] | sort }}"
      register: vpn_ping
      until: vpn_ping.rc == 0
      retries: 3
      delay: 5
      changed_when: false
      failed_when: false

    - name: Every VM answers through the VPN
      ansible.builtin.assert:
        that: vpn_ping.results | rejectattr('rc', 'eq', 0) | list | length == 0
        fail_msg: >-
          No answer through the VPN from
          {{ vpn_ping.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | join(', ') }}
        success_msg: "{{ groups['lab'] | length }} VMs answer at their VPN address"

    - name: Open the HAProxy stats page through the VPN
      ansible.builtin.uri:
        url: "http://{{ vpn_addresses[lb_name] }}:8404/stats"
        use_proxy: false
      register: stats_vpn

    - name: Try the stats page over the lab network, outside the VPN
      ansible.builtin.command: nc -zv -w 3 {{ hostvars[lb_name].ansible_host }} 8404
      register: stats_lan
      changed_when: false
      failed_when: false

    - name: The stats page only answers through the VPN
      ansible.builtin.assert:
        that:
          - stats_vpn.status == 200
          - "'timed out' in stats_lan.stderr"
        fail_msg: "{{ lb_name }}:8404 must answer through the VPN and time out outside it"
        success_msg: "{{ lb_name }}:8404 answers through the VPN and is blocked outside it"

- name: Check that the VMs cannot reach each other through the VPN
  hosts: web
  gather_facts: false
  vars:
    db_name: "{{ groups['db'][0] }}"
  tasks:
    - name: Ping the hub at its VPN address
      ansible.builtin.command: ping -c 1 -W 2 {{ vpn_addresses[vpn_hub] }}
      register: to_hub
      until: to_hub.rc == 0
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false

    - name: Ping the database VM at its VPN address
      ansible.builtin.command: ping -c 2 -W 2 {{ vpn_addresses[db_name] }}
      register: to_db
      changed_when: false
      failed_when: false

    # The first ping proves the tunnel works, so the second one fails because the hub
    # refuses to route it, not because the tunnel is down.
    - name: The hub only routes the control node's traffic
      ansible.builtin.assert:
        that:
          - to_hub.rc == 0
          - to_db.rc != 0
        fail_msg: "{{ inventory_hostname }} must reach the hub through the VPN, and the hub must not route it to {{ db_name }}"
        success_msg: "{{ inventory_hostname }} reaches the hub through the VPN, but not {{ db_name }}"

# --- step 4: the toolkit on the VMs ---------------------------------------------
- name: Check the toolkit on every VM
  hosts: lab
  become: true
  gather_facts: false
  vars:
    backup_dir: /var/backups/infra-ops
  tasks:
    - name: Read the state of the toolkit timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop:
        - healthcheck.timer
        - backup.timer
      register: timers

    - name: The health check and backup timers are running
      ansible.builtin.assert:
        that: timers.results | map(attribute='status.ActiveState') | unique == ['active']
        fail_msg: "{{ inventory_hostname }}: the toolkit timers are not all active"
        success_msg: "{{ inventory_hostname }}: health check every 5 minutes, backup every night"

    # Starting a oneshot unit waits until it has run.
    - name: Run the health check now
      ansible.builtin.systemd_service:
        name: healthcheck.service
        state: started
      changed_when: false
      failed_when: false

    - name: Read the result of that run
      ansible.builtin.systemd_service:
        name: healthcheck.service
      register: health_unit

    - name: Read the health check's latest report
      ansible.builtin.command: journalctl -u healthcheck.service -n 8 --no-pager -o cat
      register: health_log
      changed_when: false

    - name: The VM is healthy
      ansible.builtin.assert:
        that:
          - health_unit.status.Result == 'success'
          - health_unit.status.ExecMainStatus == '0'
        fail_msg: >-
          {{ inventory_hostname }} is not healthy (exit code {{ health_unit.status.ExecMainStatus }}):
          {{ health_log.stdout_lines | join(' | ') }}
        success_msg: "{{ inventory_hostname }}: HEALTH: OK"

    - name: Make a backup now
      ansible.builtin.systemd_service:
        name: backup.service
        state: started
      changed_when: false

    - name: Find the backups of /etc
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: etc-*.tar.gz
      register: backups

    - name: Create a scratch folder for a test restore
      ansible.builtin.tempfile:
        state: directory
        suffix: -restore
      register: scratch
      changed_when: false

    # restore.sh refuses to extract an archive whose checksum does not match.
    - name: Restore the newest backup into the scratch folder
      ansible.builtin.command: >-
        /usr/local/bin/restore.sh -f -t {{ scratch.path }}
        -a {{ (backups.files | sort(attribute='mtime') | last).path }}
      changed_when: false

    - name: Compare a restored file with the original
      ansible.builtin.command: cmp {{ scratch.path }}/etc/hostname /etc/hostname
      register: restore_cmp
      changed_when: false
      failed_when: false

    - name: Remove the scratch folder
      ansible.builtin.file:
        path: "{{ scratch.path }}"
        state: absent
      changed_when: false

    - name: Backups restore, and rotation keeps at most 7
      ansible.builtin.assert:
        that:
          - restore_cmp.rc == 0
          - backups.matched <= 7
        success_msg: >-
          {{ inventory_hostname }}: {{ (backups.files | sort(attribute='mtime') | last).path | basename }}
          restores (checksum checked); {{ backups.matched }} of at most 7 backups kept

- name: Send a tagged request through the load balancer
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lb_address: "{{ hostvars[groups['lb'][0]].ansible_host }}"
  tasks:
    - name: Pick a tag that appears in no other request
      ansible.builtin.set_fact:
        client_ip_probe: "verify-{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=12) }}"

    - name: Request the tagged path over HTTPS
      ansible.builtin.uri:
        url: "https://{{ lb_address }}/{{ client_ip_probe }}"
        use_proxy: false
        ca_path: "{{ tls_ca_dir }}/ca.crt"
        headers:
          Host: "{{ web_service_name }}"

- name: Check that the web servers log the real client address
  hosts: web
  become: true
  gather_facts: false
  vars:
    lb_address: "{{ hostvars[groups['lb'][0]].ansible_host }}"
    probe_lines: >-
      {{ groups['web'] | map('extract', hostvars, ['probe_line', 'stdout']) | select | list }}
  tasks:
    - name: Look for the tagged request in the access log
      ansible.builtin.command: grep -F {{ hostvars['localhost'].client_ip_probe }} /var/log/nginx/demo-app.access.log
      register: probe_line
      changed_when: false
      failed_when: false

    - name: The request is logged with the client's address, not the load balancer's
      ansible.builtin.assert:
        that:
          - probe_lines | length == 1
          - probe_lines[0].split()[0] != lb_address
        fail_msg: "expected one log line with a client address other than {{ lb_address }}, got: {{ probe_lines }}"
        success_msg: "logged from {{ probe_lines[0].split()[0] }}, the client, not the load balancer {{ lb_address }}"
      when: inventory_hostname == groups['web'][0]

# --- step 5: Nginx configured by Puppet -----------------------------------------
- name: Check the web servers that Puppet configures
  hosts: web
  become: true
  gather_facts: false
  vars:
    site_file: /etc/nginx/sites-available/demo-app
  tasks:
    - name: Skip the web servers still configured by Ansible
      ansible.builtin.meta: end_host
      when: web_config_tool != 'puppet'

    - name: Read the state of the Puppet timer
      ansible.builtin.systemd_service:
        name: puppet-apply.timer
      register: puppet_timer

    - name: Read the site file
      ansible.builtin.slurp:
        src: "{{ site_file }}"
      register: site_before

    - name: Puppet manages the site and runs every 30 minutes
      ansible.builtin.assert:
        that:
          - puppet_timer.status.ActiveState == 'active'
          - "'Managed by Puppet' in (site_before.content | b64decode)"
        fail_msg: "{{ inventory_hostname }}: the site file or the Puppet timer is not Puppet's"
        success_msg: "{{ inventory_hostname }}: Nginx is configured by Puppet, every 30 minutes"

    - name: Run Puppet once more
      ansible.builtin.command: /usr/local/sbin/puppet-apply-lab
      register: puppet_again
      changed_when: false
      failed_when: puppet_again.rc not in [0, 2]

    - name: Puppet finds nothing to change
      ansible.builtin.assert:
        that: puppet_again.rc == 0
        fail_msg: "{{ inventory_hostname }}: Puppet changed something (exit code {{ puppet_again.rc }})"
        success_msg: "{{ inventory_hostname }}: a second Puppet run changes nothing"

    - name: Edit the site file by hand, like an operator in a hurry
      ansible.builtin.lineinfile:
        path: "{{ site_file }}"
        line: "# quick fix by hand (verify.yml)"
      changed_when: false

    - name: Run the Puppet service, as its timer would
      ansible.builtin.systemd_service:
        name: puppet-apply.service
        state: started
      changed_when: false

    - name: Read the site file again
      ansible.builtin.slurp:
        src: "{{ site_file }}"
      register: site_after

    - name: Puppet reverted the manual edit
      ansible.builtin.assert:
        that: site_after.content == site_before.content
        fail_msg: "{{ inventory_hostname }}: the manual edit is still in {{ site_file }}"
        success_msg: "{{ inventory_hostname }}: Puppet put the site file back as the code says"
