name: ci

on:
  push:
  pull_request:

jobs:
  bash-toolkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Lint scripts
        run: make lint

      - name: Run tests
        run: make test
