name: ci

on:
  push:
  pull_request:

jobs:
  bash-toolkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Lint scripts
        run: make lint

      - name: Run tests
        run: make test

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Ansible and ansible-lint
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet ansible ansible-lint
          echo /tmp/venv/bin >> "$GITHUB_PATH"

      - name: Lint playbooks and roles
        run: make ansible-lint

      - name: Syntax check
        working-directory: ansible
        run: ansible-playbook -i inventory.example.ini --syntax-check site.yml verify.yml

  puppet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Puppet, puppet-lint and Ansible
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends puppet-agent puppet-lint
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet ansible
          echo /tmp/venv/bin >> "$GITHUB_PATH"

      - name: Lint and validate the Puppet code
        run: make puppet-lint

      - name: Puppet and Ansible write the same Nginx site
        run: make puppet-test
